<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your Name — Resume</title>
<meta name="description" content="Your Name — concise, scannable resume website." />
<meta name="robots" content="index, follow" />


<!-- Open Graph -->
<meta property="og:title" content="Your Name — Resume" />
<meta property="og:description" content="Scannable resume with experience, skills, and projects." />
<meta property="og:type" content="website" />


<!-- JSON-LD for ATS / Search -->
<script type="application/ld+json">
{
"@context": "https://schema.org",
"@type": "Person",
"name": "Your Name",
"jobTitle": "Your Target Role",
"url": "https://yourusername.github.io",
"email": "mailto:you@email.com",
"sameAs": [
"https://www.linkedin.com/in/yourname",
"https://github.com/yourusername"
]
}
</script>


<style>
:root {
--fg: #111;
--muted: #555;
--accent: #2563eb;
--bg: #ffffff;
--border: #e5e7eb;
}
* { box-sizing: border-box; }
body {
margin: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
color: var(--fg);
background: var(--bg);
line-height: 1.5;
}
main {
max-width: 900px;
margin: 0 auto;
padding: 32px 20px 64px;
}
header {
display: grid;
gap: 12px;
border-bottom: 2px solid var(--border);
padding-bottom: 20px;
margin-bottom: 24px;
}
h1 { font-size: 2rem; margin: 0; }
.subtitle { color: var(--muted); font-weight: 500; }
.links a {
margin-right: 12px;
color: var(--accent);
text-decoration: none;
font-weight: 600;
}
section { margin-top: 28px; }
h2 {
font-size: 1.25rem;
margin-bottom: 12px;
border-left: 4px solid var(--accent);
padding-left: 10px;
}
.grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 16px 32px;
}
@media (max-width: 700px) {
.grid { grid-template-columns: 1fr; }
}
ul { margin: 8px 0 0 18px; }
li { margin-bottom: 6px; }
</html>
